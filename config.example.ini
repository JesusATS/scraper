; Plantilla de credenciales — copia este archivo a config.ini y rellena con
; tus datos. config.ini está en .gitignore y NO debe committearse jamás.
;
; cp config.example.ini config.ini

[IMSS_CREDENCIALES]
; Ruta absoluta al archivo .cer (certificado FIEL)
RUTA_CER = /ruta/a/tu/certificado.cer

; Ruta absoluta al archivo .key (llave privada FIEL)
RUTA_KEY = /ruta/a/tu/llave.key

; RFC con homoclave (13 caracteres)
USUARIO = TU_RFC_AQUI

; Contraseña del portal IDSE
CONTRASENA_SITIO = tu_contrasena_aqui

[SELENIUM]
; Ruta absoluta al binario msedgedriver. Descarga el driver compatible con
; tu versión de Edge desde:
;   https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver/
RUTA_MSEDGEDRIVER = /ruta/a/msedgedriver
